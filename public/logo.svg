<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 512 512"
  width="512"
  height="512"
>
  <defs>
    <linearGradient
      id="muktkan-gradient"
      x1="0"
      y1="0"
      x2="512"
      y2="512"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0%" stop-color="#FF3B30"/>
      <stop offset="16%" stop-color="#FF9500"/>
      <stop offset="32%" stop-color="#FFD60A"/>
      <stop offset="48%" stop-color="#34C759"/>
      <stop offset="64%" stop-color="#00C7BE"/>
      <stop offset="78%" stop-color="#0A84FF"/>
      <stop offset="90%" stop-color="#5856D6"/>
      <stop offset="100%" stop-color="#FF2D55"/>

      <animateTransform
        attributeName="gradientTransform"
        type="rotate"
        from="0 256 256"
        to="360 256 256"
        dur="18s"
        repeatCount="indefinite"
      />
    </linearGradient>
  </defs>

  <!-- Muktkan mark -->
  <circle
    cx="256"
    cy="256"
    r="224"
    fill="url(#muktkan-gradient)"
  />

  <!-- Monospace M -->
  <text
    x="256"
    y="256"
    text-anchor="middle"
    dominant-baseline="central"
    font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
    font-size="230"
    font-weight="900"
    fill="#000000"
  >M</text>
</svg>
